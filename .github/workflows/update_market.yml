name: Update Live Market Data

on:
  schedule:
    # Run every 30 minutes from 13:00 to 22:00 UTC (US market hours Monday-Friday)
    - cron: '*/30 13-22 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Live Market & Options Data
        run: |
          python update_market_data.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add market_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market data $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
